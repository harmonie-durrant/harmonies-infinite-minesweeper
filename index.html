<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Infinite Minesweeper</title>
        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
            rel="stylesheet"
        />
    </head>
    <body class="m-0 h-dvh overflow-hidden">
        <canvas
            id="game"
            class="block h-full w-full touch-none select-none"
        ></canvas>
        <div id="game_ui" class="absolute hidden bottom-5 right-5">
            <button
                type="button"
                id="pause_button"
                class="btn btn-icon"
                aria-label="Pause"
                title="Pause (Esc)"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                >
                    <rect x="5" y="4" width="5" height="16" />
                    <rect x="14" y="4" width="5" height="16" />
                </svg>
            </button>
        </div>
        <div id="main_menu" class="arcade-overlay flex">
            <div class="arcade-panel">
                <p class="arcade-subtitle-rainbow">Harmonie's</p>
                <h1 class="arcade-title">Infinite<br />Minesweeper</h1>
                <button id="start_button" type="button" class="btn btn-primary">
                    Start
                </button>
                <button
                    id="options_button"
                    type="button"
                    class="btn btn-secondary"
                >
                    Options
                </button>
                <button
                    type="button"
                    class="btn btn-secondary btn-soon"
                    disabled
                >
                    Shop
                    <span class="tape">Coming soon</span>
                </button>
                <p class="arcade-subtitle blink">Insert coin</p>
            </div>
            <nav class="absolute right-5 bottom-5 flex gap-3">
                <a
                    href="https://discord.gg/Cjakvt9XJH"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="btn btn-icon"
                    aria-label="Discord"
                    title="Discord"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="currentColor"
                    >
                        <path
                            d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"
                        />
                    </svg>
                </a>
                <a
                    href="https://github.com/harmonie-durrant/harmonies-infinite-minesweeper"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="btn btn-icon"
                    aria-label="GitHub"
                    title="GitHub"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="currentColor"
                    >
                        <path
                            d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"
                        />
                    </svg>
                </a>
                <a
                    href="https://www.instagram.com/harmonie_drnt"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="btn btn-icon"
                    aria-label="Instagram"
                    title="Instagram"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                        stroke-linecap="square"
                        stroke-linejoin="miter"
                    >
                        <rect x="2" y="2" width="20" height="20" rx="5" />
                        <path
                            d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"
                        />
                        <path d="M17.5 6.5h.01" />
                    </svg>
                </a>
                <a
                    href="https://harmoniedurrant.com"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="btn btn-icon"
                    aria-label="Website"
                    title="Website"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                        stroke-linecap="square"
                        stroke-linejoin="miter"
                    >
                        <circle cx="12" cy="12" r="10" />
                        <path
                            d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"
                        />
                        <path d="M2 12h20" />
                    </svg>
                </a>
            </nav>
        </div>
        <div id="options_menu" class="arcade-overlay hidden">
            <div
                class="arcade-panel options-panel"
                role="dialog"
                aria-labelledby="options_title"
            >
                <h1 id="options_title" class="arcade-title">Options</h1>
                <div class="options-tabs" role="tablist">
                    <button
                        type="button"
                        role="tab"
                        id="tab_sound"
                        class="options-tab"
                        aria-selected="true"
                        aria-controls="panel_sound"
                    >
                        Music &amp; Sound
                    </button>
                    <button
                        type="button"
                        role="tab"
                        id="tab_controls"
                        class="options-tab"
                        aria-selected="false"
                        aria-controls="panel_controls"
                        tabindex="-1"
                    >
                        Controls
                    </button>
                </div>
                <div class="options-body">
                    <section
                        id="panel_sound"
                        class="options-section"
                        role="tabpanel"
                        aria-labelledby="tab_sound"
                    >
                        <label class="options-row">
                            <span class="options-label">Music</span>
                            <input
                                id="music_volume"
                                class="arcade-range"
                                type="range"
                                min="0"
                                max="100"
                            />
                            <output
                                id="music_volume_value"
                                class="options-value"
                            ></output>
                        </label>
                        <label class="options-row">
                            <span class="options-label">Sound FX</span>
                            <input
                                id="sfx_volume"
                                class="arcade-range"
                                type="range"
                                min="0"
                                max="100"
                            />
                            <output
                                id="sfx_volume_value"
                                class="options-value"
                            ></output>
                        </label>
                        <label class="options-row">
                            <span class="options-label flex-1"
                                >Show music player</span
                            >
                            <input
                                id="show_music_player"
                                class="arcade-toggle"
                                type="checkbox"
                                role="switch"
                            />
                        </label>
                    </section>
                    <section
                        id="panel_controls"
                        class="options-section"
                        role="tabpanel"
                        aria-labelledby="tab_controls"
                        hidden
                    >
                        <div class="bind-group touch-controls">
                            <h2 class="bind-group-title">Touch</h2>
                            <div class="bind-row">
                                <span class="flex-1">Tap</span>
                                <span
                                    id="touch_tap"
                                    class="touch-action"
                                ></span>
                            </div>
                            <div class="bind-row">
                                <span class="flex-1">Hold</span>
                                <span
                                    id="touch_hold"
                                    class="touch-action"
                                ></span>
                            </div>
                            <button
                                id="touch_swap"
                                type="button"
                                class="btn btn-secondary self-start text-[10px]"
                            >
                                Swap tap &amp; hold
                            </button>
                        </div>
                        <p class="arcade-subtitle leading-relaxed">
                            Press a binding, then any key or mouse button. Esc
                            cancels. Or pick a key below.
                        </p>
                        <div id="action_list" class="bind-groups"></div>
                        <div class="input-map">
                            <div id="keyboard" class="keyboard"></div>
                            <div class="flex items-end justify-center gap-10">
                                <div id="arrow_keys" class="arrow-keys"></div>
                                <div id="mouse" class="mouse"></div>
                            </div>
                        </div>
                        <div id="key_picker" class="key-picker" hidden>
                            <p class="arcade-subtitle">
                                <span
                                    id="key_picker_label"
                                    class="text-arcade-yellow"
                                ></span>
                                does
                            </p>
                            <div
                                id="key_picker_actions"
                                class="flex flex-wrap gap-2"
                            ></div>
                        </div>
                        <button
                            id="reset_keybinds"
                            type="button"
                            class="btn btn-secondary self-start text-[10px]"
                        >
                            Reset controls
                        </button>
                    </section>
                </div>
                <button id="options_back" type="button" class="btn btn-primary">
                    Back
                </button>
            </div>
        </div>
        <div id="pause_menu" class="arcade-overlay hidden">
            <div
                class="arcade-panel"
                role="dialog"
                aria-labelledby="pause_title"
            >
                <h1 id="pause_title" class="arcade-title">Paused</h1>
                <button
                    id="resume_button"
                    type="button"
                    class="btn btn-primary"
                >
                    Resume
                </button>
                <button
                    id="pause_restart_button"
                    type="button"
                    class="btn btn-secondary"
                >
                    Restart
                </button>
                <button
                    id="pause_options_button"
                    type="button"
                    class="btn btn-secondary"
                >
                    Options
                </button>
                <button
                    type="button"
                    class="btn btn-secondary btn-soon"
                    disabled
                >
                    Shop
                    <span class="tape">Coming soon</span>
                </button>
                <button
                    id="pause_main_menu_button"
                    type="button"
                    class="btn btn-secondary"
                >
                    Main menu
                </button>
            </div>
        </div>
        <div id="confirm_menu" class="arcade-overlay hidden">
            <div
                class="arcade-panel"
                role="alertdialog"
                aria-labelledby="confirm_title"
                aria-describedby="confirm_message"
            >
                <h1 id="confirm_title" class="arcade-title"></h1>
                <p id="confirm_message" class="arcade-subtitle"></p>
                <button id="confirm_yes" type="button" class="btn btn-primary">
                    Yes
                </button>
                <button id="confirm_no" type="button" class="btn btn-secondary">
                    No
                </button>
            </div>
        </div>
        <div id="run_stats_menu" class="arcade-overlay hidden">
            <div
                class="arcade-panel"
                role="dialog"
                aria-labelledby="run_stats_title"
            >
                <h1 id="run_stats_title" class="arcade-title">Run stats</h1>
                <dl class="run-stats">
                    <div class="run-stat">
                        <dt>Coins</dt>
                        <dd class="run-stat-value">
                            <span id="run_coins">0</span>
                            <span aria-hidden="true">x</span>
                            <img class="coin-icon" src="/coin.svg" alt="" />
                        </dd>
                    </div>
                </dl>
                <button
                    id="run_stats_continue"
                    type="button"
                    class="btn btn-primary"
                >
                    Continue
                </button>
                <p class="arcade-subtitle blink">Press Enter</p>
            </div>
        </div>
        <div id="game_over_menu" class="arcade-overlay hidden">
            <div class="arcade-panel">
                <h1 class="arcade-title">Game Over</h1>
                <p class="arcade-subtitle">You hit a mine</p>
                <button
                    id="play_again_button"
                    type="button"
                    class="btn btn-primary"
                >
                    Play again
                </button>
                <button
                    id="view_map_button"
                    type="button"
                    class="btn btn-secondary"
                >
                    View map
                </button>
                <button
                    id="main_menu_button"
                    type="button"
                    class="btn btn-secondary"
                >
                    Main menu
                </button>
                <button
                    type="button"
                    class="btn btn-secondary btn-soon"
                    disabled
                >
                    Shop
                    <span class="tape">Coming soon</span>
                </button>
                <p class="arcade-subtitle blink">Press Enter</p>
            </div>
        </div>
        <div id="volume_hud" class="volume-hud hidden" aria-hidden="true">
            <div class="volume-channel" data-channel="music">
                <span class="volume-value"></span>
                <div class="volume-bar"><div class="volume-fill"></div></div>
                <span class="volume-label">Music</span>
            </div>
            <div class="volume-channel" data-channel="sfx">
                <span class="volume-value"></span>
                <div class="volume-bar"><div class="volume-fill"></div></div>
                <span class="volume-label">SFX</span>
            </div>
        </div>
        <div class="top-right-hud">
            <div id="music_player" class="music-player">
                <button
                    type="button"
                    id="music_collapse"
                    class="music-collapse"
                    aria-controls="music_details"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="3"
                        stroke-linecap="square"
                        stroke-linejoin="miter"
                        aria-hidden="true"
                    >
                        <path d="m9 5 7 7-7 7" />
                    </svg>
                </button>
                <img
                    id="music_cover"
                    class="music-cover"
                    alt=""
                    aria-hidden="true"
                />
                <div
                    id="music_details"
                    class="music-details"
                    aria-live="polite"
                >
                    <p id="music_title" class="music-title"></p>
                    <p id="music_artist" class="arcade-subtitle truncate"></p>
                </div>
                <button
                    type="button"
                    id="music_mute"
                    class="btn btn-icon btn-icon-sm"
                    aria-label="Mute music"
                    title="Mute music"
                >
                    <svg
                        id="music_icon_on"
                        xmlns="http://www.w3.org/2000/svg"
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                        stroke-linecap="square"
                        stroke-linejoin="miter"
                    >
                        <path d="M11 5 6 9H2v6h4l5 4V5z" />
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
                    </svg>
                    <svg
                        id="music_icon_off"
                        class="hidden"
                        xmlns="http://www.w3.org/2000/svg"
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                        stroke-linecap="square"
                        stroke-linejoin="miter"
                    >
                        <path d="M11 5 6 9H2v6h4l5 4V5z" />
                        <path d="m22 9-6 6" />
                        <path d="m16 9 6 6" />
                    </svg>
                </button>
                <button
                    type="button"
                    id="music_skip"
                    class="btn btn-icon btn-icon-sm"
                    aria-label="Next track"
                    title="Next track"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                        stroke-linecap="square"
                        stroke-linejoin="miter"
                    >
                        <path d="m5 4 10 8-10 8V4z" />
                        <path d="M19 5v14" />
                    </svg>
                </button>
            </div>
            <div id="coin_balance" class="coin-balance">
                <span id="coin_count"></span>
                <span aria-hidden="true">x</span>
                <img id="coin_icon" class="coin-icon" src="/coin.svg" alt="" />
            </div>
            <div
                id="run_coin_balance"
                class="run-coin-balance hidden"
                aria-hidden="true"
            ></div>
        </div>
        <div id="coin_layer" class="coin-layer" aria-hidden="true"></div>
        <div class="crt" aria-hidden="true"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
