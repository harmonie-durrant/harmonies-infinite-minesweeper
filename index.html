<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Infinite Minesweeper</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
            rel="stylesheet"
        />
    </head>
    <body class="m-0 h-dvh overflow-hidden">
        <canvas id="game" class="block h-full w-full touch-none"></canvas>
        <div id="game_ui" class="absolute hidden bottom-5 right-5">
            <button
                type="button"
                id="restart_button_ui"
                class="btn btn-icon"
                aria-label="Restart"
                title="Restart"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    stroke-linecap="square"
                    stroke-linejoin="miter"
                    class="lucide lucide-rotate-ccw preview-icon"
                >
                    <path
                        d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"
                    />
                    <path d="M3 3v5h5" />
                </svg>
            </button>
        </div>
        <div id="main_menu" class="arcade-overlay flex">
            <div class="arcade-panel">
                <p class="arcade-subtitle">Harmonie's</p>
                <h1 class="arcade-title">Infinite<br />Minesweeper</h1>
                <button id="start_button" type="button" class="btn btn-primary">
                    Start
                </button>
                <p class="arcade-subtitle blink">Insert coin</p>
            </div>
        </div>
        <div id="game_over_menu" class="arcade-overlay hidden">
            <div class="arcade-panel">
                <h1 class="arcade-title">Game Over</h1>
                <p class="arcade-subtitle">You hit a mine</p>
                <button
                    id="restart_button"
                    type="button"
                    class="btn btn-primary"
                >
                    Try again
                </button>
                <button
                    id="view_map_button"
                    type="button"
                    class="btn btn-secondary"
                >
                    View map
                </button>
            </div>
        </div>
        <div class="crt" aria-hidden="true"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
